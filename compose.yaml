# Environnement de développement Espace O+
# Lancement : docker compose up -d --build

services:
  # PHP-FPM : exécute le code Symfony
  php:
    build: ./docker/php
    volumes:
      - ./api:/var/www/api          # le code est monté : une modification est visible sans reconstruire l'image
    depends_on:
      database:
        condition: service_healthy  # attend que MySQL accepte les connexions

  # Nginx : reçoit les requêtes HTTP et transmet les fichiers .php à PHP-FPM
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"                   # API accessible sur http://localhost:8000
    volumes:
      - ./api/public:/var/www/api/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # MySQL 8.4 (version LTS) : base de données
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"                 # 3307 côté machine pour ne pas entrer en conflit avec un MySQL local
    volumes:
      - database_data:/var/lib/mysql   # les données survivent à l'arrêt des conteneurs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mailpit : capture les emails envoyés en local (interface sur http://localhost:8025)
  mailer:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"                 # interface web
      - "1025:1025"                 # serveur SMTP

volumes:
  database_data:
