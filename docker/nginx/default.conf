server {
    listen 80;
    root /var/www/api/public;

    # Toute URL qui n'est pas un fichier existant est envoyée au contrôleur frontal de Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul index.php est exécuté : les autres fichiers .php ne sont jamais accessibles
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;      # "php" = nom du service dans compose.yaml
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
